# Cardory 项目 Dart 静态分析规则。
#
# 本文件配置 analyzer，用于静态检查 Dart 代码中的错误、警告和 lint 规则。
# 默认基于 flutter_lints 推荐规则集，可在下方自定义启用或禁用特定规则。
#
# 分析器发现的问题会显示在支持 Dart 的 IDE 中（如 VS Code / Android Studio）。
# 也可通过命令行运行 `flutter analyze` 手动触发静态检查。

include: package:flutter_lints/flutter.yaml

linter:
  # 本项目的 lint 规则可在下方区域自定义：
  # 可禁用上方 include 的 `package:flutter_lints/flutter.yaml` 中的规则，
  # 也可启用额外规则。全部可用 lint 及其文档见 https://dart.dev/lints。
  #
  # 除在下方对整个项目禁用某条 lint 外，也可以仅针对某一行代码
  # 或某个 dart 文件，使用 `// ignore: 规则名` 与
  # `// ignore_for_file: 规则名` 语法在产生该 lint 的行或文件中抑制它。
  rules:
    # avoid_print: false  # 取消注释以禁用 avoid_print 规则
    # prefer_single_quotes: true  # 取消注释以启用 prefer_single_quotes 规则

# 本文件的更多信息参见
# https://dart.dev/guides/language/analysis-options
