# Cardory 项目元数据与依赖声明。
# - 应用名: cardory（板记 Cardory）
# - 描述: 以项目看板和待办为核心的跨平台进度管理应用
# - 发布: pub.dev 已禁止（publish_to: none）
# - 资源: 品牌图标位于 assets/branding/

name: cardory
description: "板记 Cardory 是一个以项目看板和待办为核心的跨平台进度管理应用。"
# 下面这一行可防止本包被 `flutter pub publish` 意外发布到 pub.dev，
# 适合私有包使用。
publish_to: 'none' # 如需发布到 pub.dev，请删除此行

# 以下定义应用的版本号与构建号。
# 版本号为三个以点分隔的数字，如 1.2.43，
# 后接可选的以 + 分隔的构建号。
# 版本号与构建号均可在 flutter build 时通过
# --build-name 与 --build-number 参数分别覆盖。
# Android 中 build-name 用作 versionName，build-number 用作 versionCode。
# 更多 Android 版本号信息见 https://developer.android.com/studio/publish/versioning
# iOS 中 build-name 用作 CFBundleShortVersionString，build-number 用作 CFBundleVersion。
# 更多 iOS 版本号信息见
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# Windows 中 build-name 用作产品与文件版本的主/次/修订号，
# build-number 用作构建后缀。
version: 0.0.4+1

environment:
  sdk: ^3.9.2

# 依赖声明了本包运行所需的其它包。
# 如需自动升级依赖到最新版本，可运行 `flutter pub upgrade --major-versions`；
# 也可以手动修改下方的版本号为 pub.dev 上的最新版本。
# 使用 `flutter pub outdated` 可查看哪些依赖有更新的版本。
dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.5
  cryptography: ^2.9.0
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  file_picker: ^10.3.0
  path: ^1.9.1
  home_widget: ^0.7.0
  webdav_client: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 下方的 flutter_lints 包提供一组推荐的 lint 规则，用于鼓励良好的编码实践。
  # 该包提供的规则集在包根目录的 `analysis_options.yaml` 中启用。
  # 如需禁用特定规则或启用额外规则，请参见该文件。
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/branding/app_icon_source.png"
  android: true
  ios: true
  # Windows 图标由 tools/gen_win_icon.ps1 生成（多尺寸标准 ICO）
  macos:
    generate: true

# 本文件通用 Dart 部分的信息参见
# https://dart.dev/tools/pub/pubspec

# 以下部分为 Flutter 包专有配置。
flutter:

  # 下面这一行确保应用包含 Material Icons 字体，
  # 以便使用 material Icons 类中的图标。
  uses-material-design: true

  assets:
    - assets/branding/app_icon_source.png

  # 如需为应用添加资源，请添加 assets 区域，示例如下：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 图片资源可引用一个或多个分辨率专用"变体"，参见
  # https://flutter.dev/to/resolution-aware-images

  # 关于从包依赖添加资源的细节，参见
  # https://flutter.dev/to/asset-from-package

  # 如需为应用添加自定义字体，请在此 "flutter" 区域添加 fonts 区块。
  # 列表中每一项都应包含字体族名称的 "family" 键，以及给出字体资源
  # 及其它描述符列表的 "fonts" 键。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 关于从包依赖添加字体的细节，
  # 参见 https://flutter.dev/to/font-from-package
