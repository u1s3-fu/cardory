name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（仅手动触发时使用，例如 v1.0.1）'
        required: false
        default: ''

jobs:
  # 三平台自动构建并上传构建产物
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build: apk
            flags: ''
            name: android-apk
            path: build/app/outputs/flutter-apk/app-release.apk
            artifact: app-release.apk
          - platform: windows
            os: windows-latest
            build: windows
            flags: ''
            name: windows-build
            path: build/windows/x64/runner/Release
            artifact: cardory-windows-x64.zip
          - platform: macos
            os: macos-latest
            build: macos
            flags: ''
            name: macos-build
            path: build/macos/Build/Products/Release/Cardory.app
            artifact: cardory-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ${{ matrix.build }} --release ${{ matrix.flags }}

      # Android 直接上传 APK
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      # Windows / macOS 先压缩成 zip 再上传
      - name: Package Windows build
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path "${{ matrix.path }}/*" -DestinationPath "${{ matrix.artifact }}"
      - name: Package macOS build
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent "${{ matrix.path }}" "${{ matrix.artifact }}"
      - name: Upload packaged archive
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # 汇总所有产物并创建 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}"
          else
            echo "tag=v${{ github.run_number }}"
          fi >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
