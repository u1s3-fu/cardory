name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（仅手动触发时使用，例如 v1.0.1）'
        required: false
        default: ''

jobs:
  # 三平台自动构建并上传构建产物
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build: apk
            flags: ''
            name: android-apk
            path: build/app/outputs/flutter-apk/app-release.apk
            artifact: app-release.apk
          - platform: windows
            os: windows-latest
            build: windows
            flags: ''
            name: windows-build
            path: build/windows/x64/runner/Release
            artifact: cardory-windows-x64.zip
          - platform: macos
            os: macos-latest
            build: macos
            flags: ''
            name: macos-build
            path: build/macos/Build/Products/Release/Cardory.app
            artifact: cardory-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # 从 GitHub Secrets 还原正式签名 keystore 与 key.properties，
      # 保证 CI 与本地构建使用同一把签名。
      # 所有 Secrets 必须已配置，否则构建直接失败。
      - name: Set up Android release signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secret(s). Please configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in GitHub Secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/cardory-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=cardory-release.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - run: flutter build ${{ matrix.build }} --release ${{ matrix.flags }}

      # Android 直接上传 APK
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      # Windows / macOS 先压缩成 zip 再上传
      - name: Package Windows build
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path "${{ matrix.path }}/*" -DestinationPath "${{ matrix.artifact }}"
      - name: Package macOS build
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent "${{ matrix.path }}" "${{ matrix.artifact }}"
      - name: Upload packaged archive
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # 汇总所有产物并创建 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}"
          else
            echo "tag=v${{ github.run_number }}"
          fi >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
