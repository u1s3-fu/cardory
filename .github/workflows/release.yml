# Cardory 多平台自动发布工作流。
# 推送 v* tag 或手动触发时，构建三平台产物：
#   Android (arm64) / Windows (x64) / macOS (arm64)
# 产物统一命名为 cardory-平台-架构-版本号 格式。

name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（仅手动触发时使用，例如 v1.0.1）'
        required: false
        default: ''

jobs:
  # 三平台自动构建并上传构建产物
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build: apk
            arch: arm64
            flags: '--target-platform android-arm64'
            path: build/app/outputs/flutter-apk/app-release.apk
          - platform: windows
            os: windows-latest
            build: windows
            arch: x64
            flags: ''
            path: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            build: macos
            arch: arm64
            flags: ''
            path: build/macos/Build/Products/Release/Cardory.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android 构建要求 Java 21（见 android/app/build.gradle.kts 的 compileOptions），
      # 而 ubuntu-latest 内置默认 JDK 17，必须显式安装，否则 javac 报 invalid source release: 21。
      - name: Set up JDK 21
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: flutter pub get

      # 在各平台 job 内独立计算版本号，用于最终产物重命名。
      # 逻辑与 release job 保持一致。
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "version=${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}"
          else
            echo "version=v${{ github.run_number }}"
          fi >> "$GITHUB_OUTPUT"

      # 从 GitHub Secrets 还原正式签名 keystore 与 key.properties，
      # 保证 CI 与本地构建使用同一把签名。
      # 所有 Secrets 必须已配置，否则构建直接失败。
      - name: Set up Android release signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secret(s). Please configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in GitHub Secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/cardory-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=cardory-release.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - run: flutter build ${{ matrix.build }} --release ${{ matrix.flags }}

      # Android：将 APK 重命名为 应用名-平台-架构-版本号 规范格式
      - name: Rename Android APK
        if: matrix.platform == 'android'
        run: mv "${{ matrix.path }}" "cardory-android-arm64-${{ steps.version.outputs.version }}.apk"
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: cardory-android-arm64-${{ steps.version.outputs.version }}.apk
          path: cardory-android-arm64-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      # Windows / macOS 重命名并压缩成 应用名-平台-架构-版本号.zip 后上传
      - name: Package & Rename Windows build
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path "${{ matrix.path }}/*" -DestinationPath "cardory-windows-x64-${{ steps.version.outputs.version }}.zip"
      - name: Rename & Upload macOS build
        if: matrix.platform == 'macos'
        run: |
          mv "${{ matrix.path }}" "cardory-macos-arm64-${{ steps.version.outputs.version }}.app"
          ditto -c -k --keepParent "cardory-macos-arm64-${{ steps.version.outputs.version }}.app" "cardory-macos-arm64-${{ steps.version.outputs.version }}.zip"
      - name: Upload packaged archive
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: cardory-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip
          path: cardory-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  # 汇总所有产物并创建 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}"
          else
            echo "tag=v${{ github.run_number }}"
          fi >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: false
          body: |
            Android (arm64) · Windows (x64) · macOS (arm64)
          files: artifacts/*
          fail_on_unmatched_files: true
